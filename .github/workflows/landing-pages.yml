# 产品落地页自动发布：landing/ 变更时同步到 gh-pages 分支（GitHub Pages）
name: Deploy Landing Page

on:
  push:
    branches:
      - main
      - dev
    paths:
      - landing/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          publish_branch: gh-pages
          commit_message: "docs: 自动发布产品落地页 (${{ github.sha }})"
